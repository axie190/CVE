<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>TH. Board (과제2 확인용)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 상단 네비게이션. 실제 board(Flask)의 base.html이랑 클래스 그대로 맞춤 -->
  <nav class="board-nav">
    <a href="#" class="board-nav__logo" onclick="showList(); return false;">TH. Board</a>
    <div class="board-nav__right">
      <a href="#" class="board-nav__link" onclick="showLogin(); return false;">로그인</a>
      <a href="#" class="board-nav__link" onclick="showRegister(); return false;">회원가입</a>
    </div>
  </nav>

  <main class="board-main">

    <!-- 목록 화면 -->
    <section id="view-list">
      <div class="board-header">
        <h1 class="board-title">Board.</h1>
        <button class="btn btn--point" onclick="showWrite()">글쓰기</button>
      </div>
      <table class="post-table">
        <thead>
          <tr>
            <th class="post-table__id">번호</th>
            <th>제목</th>
            <th class="post-table__author">작성자</th>
            <th class="post-table__views">조회</th>
            <th class="post-table__date">작성일</th>
          </tr>
        </thead>
        <tbody id="post-table-body"></tbody>
      </table>
    </section>

    <!-- 글쓰기 화면 -->
    <section id="view-write" hidden>
      <h1 class="board-title">글쓰기</h1>
      <form class="post-form" onsubmit="submitWrite(event)">
        <div class="post-form__row">
          <label for="w-title">제목</label>
          <input type="text" id="w-title" required />
        </div>
        <div class="post-form__row">
          <label for="w-author">작성자</label>
          <input type="text" id="w-author" placeholder="익명" />
        </div>
        <div class="post-form__row">
          <label for="w-password">비밀번호</label>
          <input type="password" id="w-password" required placeholder="수정/삭제할 때 필요한 비밀번호" />
        </div>
        <div class="post-form__row post-form__row--checkbox">
          <label><input type="checkbox" id="w-secret" /> 비밀글로 작성 (비밀번호를 입력해야만 내용을 볼 수 있습니다)</label>
        </div>
        <div class="post-form__row">
          <label for="w-content">내용</label>
          <textarea id="w-content" rows="10" required></textarea>
        </div>
        <div class="post-form__actions">
          <button type="button" class="btn btn--gray" onclick="showList()">취소</button>
          <button type="submit" class="btn btn--point">등록</button>
        </div>
      </form>
    </section>

    <!-- 상세보기 화면 -->
    <section id="view-post" hidden>
      <article class="post-view">
        <h1 class="post-view__title" id="pv-title"></h1>
        <div class="post-view__meta" id="pv-meta"></div>
        <div id="pv-body"></div>
        <div class="post-view__actions">
          <button class="btn btn--gray" onclick="showList()">목록</button>
          <button class="btn btn--danger" onclick="doDelete()">삭제</button>
        </div>
      </article>
    </section>

    <!-- 로그인 화면 -->
    <section id="view-login" hidden>
      <h1 class="board-title">로그인</h1>
      <form class="post-form" onsubmit="submitLogin(event)">
        <div class="post-form__row">
          <label for="li-username">아이디</label>
          <input type="text" id="li-username" required />
        </div>
        <div class="post-form__row">
          <label for="li-password">비밀번호</label>
          <input type="password" id="li-password" required />
        </div>
        <div class="post-form__actions">
          <a href="#" class="btn btn--gray" onclick="showRegister(); return false;">회원가입</a>
          <button type="submit" class="btn btn--point">로그인</button>
        </div>
      </form>
      <div id="login-result"></div>
    </section>

    <!-- 회원가입 화면 -->
    <section id="view-register" hidden>
      <h1 class="board-title">회원가입</h1>
      <form class="post-form" onsubmit="submitRegister(event)">
        <div class="post-form__row">
          <label for="re-username">아이디</label>
          <input type="text" id="re-username" required />
        </div>
        <div class="post-form__row">
          <label for="re-password">비밀번호</label>
          <input type="password" id="re-password" required />
        </div>
        <div class="post-form__actions">
          <button type="submit" class="btn btn--point">가입</button>
        </div>
      </form>
      <div id="register-result"></div>
    </section>

  </main>

  <!-- 비밀번호 입력용 팝업창. board의 view.html에 있는 것과 똑같은 구조로 만듦.
       비밀글 열람이랑 삭제 둘 다 이 팝업 하나를 같이 씀 -->
  <div id="passwordModal" class="password-modal">
    <div class="password-modal__box">
      <p>비밀번호를 입력하세요</p>
      <input type="password" id="passwordModalInput" onkeydown="if (event.key === 'Enter') confirmPasswordModal();" />
      <div class="password-modal__actions">
        <button type="button" class="btn btn--gray" onclick="cancelPasswordModal()">취소</button>
        <button type="button" class="btn btn--point" onclick="confirmPasswordModal()">확인</button>
      </div>
    </div>
  </div>

<script>
// 화면 전환은 그냥 section들 hidden 속성 켰다 껐다 하는 식으로 함 (페이지 이동 없이)
function showSection(id) {
  ['view-list', 'view-write', 'view-post', 'view-login', 'view-register'].forEach(function (s) {
    document.getElementById(s).hidden = (s !== id);
  });
}

function showList() {
  showSection('view-list');
  loadList();
}

function showWrite() {
  document.getElementById('w-title').value = '';
  document.getElementById('w-author').value = '';
  document.getElementById('w-password').value = '';
  document.getElementById('w-secret').checked = false;
  document.getElementById('w-content').value = '';
  showSection('view-write');
}

function showLogin() {
  showSection('view-login');
}

function showRegister() {
  showSection('view-register');
}

// ---------- 목록 ----------
async function loadList() {
  const res = await fetch('/api/posts');
  const rows = await res.json();
  const body = document.getElementById('post-table-body');

  if (rows.length === 0) {
    body.innerHTML = '<tr><td colspan="5" class="post-table__empty">게시글이 없습니다.</td></tr>';
    return;
  }

  let html = '';
  for (const p of rows) {
    const lock = p.isSecret ? '🔒 ' : '';
    const date = (p.createdAt || '').slice(0, 10);
    html += '<tr>';
    html += '<td class="post-table__id">' + p.id + '</td>';
    html += '<td class="post-table__title"><a href="#" onclick="openPost(' + p.id + '); return false;">' + lock + escapeHtml(p.title) + '</a></td>';
    html += '<td class="post-table__author">' + escapeHtml(p.author) + '</td>';
    html += '<td class="post-table__views">' + p.views + '</td>';
    html += '<td class="post-table__date">' + date + '</td>';
    html += '</tr>';
  }
  body.innerHTML = html;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : s;
  return div.innerHTML;
}

// ---------- 상세보기 ----------
let currentPost = null; // 지금 보고 있는 글 (삭제/비밀글 확인할 때 title 다시 씀)

async function openPost(id) {
  const res = await fetch('/api/posts/' + id);
  const post = await res.json();
  if (post.error) {
    alert(post.error);
    return;
  }
  currentPost = post;

  document.getElementById('pv-title').textContent = (post.isSecret ? '🔒 ' : '') + post.title;
  document.getElementById('pv-meta').textContent = post.author + ' · 조회 ' + post.views;

  const bodyEl = document.getElementById('pv-body');
  if (post.isSecret) {
    bodyEl.innerHTML =
      '<div class="post-view__locked">' +
      '<p>🔒 비밀글입니다. 비밀번호를 입력하면 내용을 볼 수 있습니다.</p>' +
      '<button type="button" class="btn btn--point" onclick="unlockSecret()">내용 보기</button>' +
      '</div>';
  } else {
    bodyEl.innerHTML = '<div class="post-view__content"></div>';
    bodyEl.firstChild.textContent = post.content;
  }

  showSection('view-post');
}

// ---------- 비밀번호 팝업 (비밀글 열람 / 삭제 공용) ----------
let passwordModalCallback = null;

function askPassword(callback) {
  passwordModalCallback = callback;
  document.getElementById('passwordModalInput').value = '';
  document.getElementById('passwordModal').style.display = 'flex';
  document.getElementById('passwordModalInput').focus();
}

function cancelPasswordModal() {
  document.getElementById('passwordModal').style.display = 'none';
  passwordModalCallback = null;
}

function confirmPasswordModal() {
  const pw = document.getElementById('passwordModalInput').value;
  document.getElementById('passwordModal').style.display = 'none';
  if (pw && passwordModalCallback) {
    passwordModalCallback(pw);
  }
}

// ---------- 기능 2: 비밀글 조회 (여기서 CVE-2023-25813 취약점 API를 호출함) ----------
function unlockSecret() {
  askPassword(function (pw) {
    verifySecret(pw);
  });
}

async function verifySecret(pw) {
  const qs = new URLSearchParams({ title: currentPost.title, password: pw });
  const res = await fetch('/api/posts/secret?' + qs.toString());
  const rows = await res.json();
  if (rows.length > 0) {
    const bodyEl = document.getElementById('pv-body');
    bodyEl.innerHTML = '<div class="post-view__content"></div>';
    bodyEl.firstChild.textContent = rows[0].content;
  } else {
    alert('비밀번호가 일치하지 않습니다.');
  }
}

// ---------- 기능 3: 게시글 삭제 (여기도 CVE-2023-25813 취약점 API를 호출함) ----------
function doDelete() {
  askPassword(function (pw) {
    verifyDelete(pw);
  });
}

async function verifyDelete(pw) {
  const res = await fetch('/api/posts/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: currentPost.title, password: pw }),
  });
  const data = await res.json();
  if (data.deletedCount > 0) {
    alert('삭제되었습니다.');
    showList();
  } else {
    alert('비밀번호가 일치하지 않습니다.');
  }
}

// ---------- 글쓰기 ----------
async function submitWrite(e) {
  e.preventDefault();
  const body = {
    title: document.getElementById('w-title').value,
    author: document.getElementById('w-author').value,
    password: document.getElementById('w-password').value,
    isSecret: document.getElementById('w-secret').checked,
    content: document.getElementById('w-content').value,
  };
  await fetch('/api/posts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  showList();
}

// ---------- 기능 1: 로그인 (여기가 CVE-2023-25813 취약점 API임) ----------
async function submitLogin(e) {
  e.preventDefault();
  const username = document.getElementById('li-username').value;
  const password = document.getElementById('li-password').value;
  const qs = new URLSearchParams({ username: username, password: password });
  const res = await fetch('/api/login?' + qs.toString());
  const rows = await res.json();
  const el = document.getElementById('login-result');
  if (rows.length > 0) {
    el.innerHTML = '<p class="post-view__author-profile-note">로그인 성공: ' + escapeHtml(rows[0].username) + '</p>';
  } else {
    el.innerHTML = '<p class="form-error">아이디 또는 비밀번호가 일치하지 않습니다.</p>';
  }
}

// ---------- 회원가입 ----------
async function submitRegister(e) {
  e.preventDefault();
  const body = {
    username: document.getElementById('re-username').value,
    password: document.getElementById('re-password').value,
  };
  const res = await fetch('/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  const el = document.getElementById('register-result');
  el.innerHTML = data.error
    ? '<p class="form-error">' + data.error + '</p>'
    : '<p class="post-view__author-profile-note">가입 완료: ' + escapeHtml(data.username) + '</p>';
}

// 페이지 처음 열리면 목록부터 보여줌
loadList();
</script>
</body>
</html>
